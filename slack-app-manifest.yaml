# Slack app manifest for hobo (Socket Mode, used by @hubot-friends/hubot-slack).
# Create the app from this at https://api.slack.com/apps > Create New App > From a manifest,
# or paste it into an existing app's "App Manifest" page.
# For the test app, change both names to hobo-dev.
display_information:
  name: hobo
  description: For the Horde's friendly neighborhood chatbot
  background_color: "#3d001d"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: hobo
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - user_change
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
